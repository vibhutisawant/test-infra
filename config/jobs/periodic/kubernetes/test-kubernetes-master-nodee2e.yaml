periodics:
  - name: ci-kubernetes-s390x-e2e-node-latest-kubetest2
    cron: "30 3-21/6 * * *" #  every 6h starting at 03:30 UTC
    cluster: k8s-infra-s390x-prow-build
    labels:
      preset-ibmcloud-cred: "true"
    decorate: true
    decoration_config:
      timeout: 220m
    extra_refs:
      - base_ref: main
        org: kubernetes-sigs
        repo: provider-ibmcloud-test-infra
        workdir: true
    annotations:
      description: Runs e2e-node tests using kubetest2 on IBM vpc
      testgrid-dashboards: ibm-s390x-node-e2e, ibm-s390x-k8s, sig-node-s390x
      testgrid-tab-name: ci-kubernetes-s390x-e2e-node-latest-kubetest2
      testgrid-alert-email: sig-cloud-provider-ibm-ppc64le-alerts@kubernetes.io
      testgrid-num-failures-to-alert: '2'
    spec:
      containers:
        - image: us-central1-docker.pkg.dev/k8s-staging-test-infra/images/kubekins-e2e:v20251021-e2c2c9806f-master
          env:
            - name: "BOSKOS_HOST"
              value: "boskos.test-pods.svc.cluster.local"
            - name: "USER"
              value: "ci-kubernetes-ppc64le-e2e-node-latest-kubetest2"
          resources:
            requests:
              cpu: 2
              memory: 10Gi
            limits:
              cpu: 2
              memory: 10Gi
          command:
            - runner.sh
          args:
            - bash
            - -c
            - |
              set -o xtrace

              heartbeat_account(){
                count=0
                url="http://${BOSKOS_HOST}/update?name=${BOSKOS_RESOURCE_NAME}&state=busy&owner=${USER}"
                while [ ${count} -lt 120 ]
                do
                  status_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST ${url})
                  if [[ ${status_code} != 200 ]]; then
                    echo "Heart beat to resource '${BOSKOS_RESOURCE_NAME}' failed due to invalid response, status code: ${status_code}"
                    exit 1
                  fi
                  count=$(( $count + 1 ))
                  sleep 60
                done
              }
          
              if [ -n "${BOSKOS_HOST:-}" ]; then
                set +o xtrace
                url="http://${BOSKOS_HOST}/acquire?type=${RESOURCE_TYPE}&state=free&dest=busy&owner=${USER}"
                output=$(curl -v -X POST ${url})
                [ $? = 0 ] && status_code=200
          
                if [[ ${status_code} == 200 && ${output} =~ "failed" ]]; then
                  echo "Failed to acquire resource from Boskos of type ${RESOURCE_TYPE}"
                  exit 1
                elif [[ ${status_code} == 200 ]]; then
                  export BOSKOS_RESOURCE_NAME=$(echo ${output} | jq -r '.name')
                  export BOSKOS_REGION=$(echo ${output} | jq -r '.userdata["region"]')
                  export BOSKOS_ZONE=$(echo ${output} | jq -r '.userdata["zone"]')
                  rm -rf output.json
                else
                  echo "Failed to acquire resource due to invalid response, status code : ${status_code}"
                  exit 1
                fi
          
                heartbeat_account >> "$ARTIFACTS/boskos.log" 2>&1 &
                HEART_BEAT_PID=$(echo $!)
              fi
          
              echo "print variables"
              echo ${BOSKOS_REGION}
              echo ${BOSKOS_ZONE}
              echo ${BOSKOS_RESOURCE_NAME}


              make install-deployer-tf

              CLUSTER_NAME="config2-$(date +%s)"

              set +o errexit
              kubetest2 tf  --target-provider vpc --vpc-node-image-name ibm-ubuntu-22-04-4-minimal-s390x-3 \
              --vpc-region ${BOSKOS_REGION} --vpc-zone ${BOSKOS_ZONE} \
              --vpc-name ${BOSKOS_RESOURCE_NAME} \
              --vpc-resource-group ${BOSKOS_RESOURCE_GROUP} \
              --vpc-ssh-key k8s-s390x-ssh-key \
              --vpc-node-profile bz2-4x16 \
              --cluster-name $CLUSTER_NAME \
              --up --set-kubeconfig=false --auto-approve --retry-on-tf-failure 3 \
              --build-version $(curl -Ls https://dl.k8s.io/ci/latest.txt) \
              --break-kubetest-on-upfail true \
              --playbook k8s-node-remote.yml

              EXTERNAL_IP=`grep -E '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' $(pwd)/$CLUSTER_NAME/hosts`

              # Skipping test related to https://github.com/kubernetes/kubernetes/issues/124791
              kubetest2 tf  --target-provider vpc --test=exec -- ssh -i /etc/secret-volume/ssh-privatekey root@$EXTERNAL_IP \
                "export SKIP='\[Flaky\]|\[Slow\]|\[Serial\]|should.execute.readiness.probe.while.in.preStop' && /make-test-e2e-node.sh"; \
                rc=$?; scp -r -i /etc/secret-volume/ssh-privatekey root@$EXTERNAL_IP:/tmp/_artifacts $ARTIFACTS

              kubetest2 tf --target-provider vpc --vpc-region ${BOSKOS_REGION} --vpc-zone ${BOSKOS_ZONE} \
                --ignore-cluster-dir true \
                --cluster-name $CLUSTER_NAME\
                --down --auto-approve --ignore-destroy-errors
              [ -z "${BOSKOS_HOST:-}" ] || release_account >> "$ARTIFACTS/boskos.log" 2>&1
              [ $rc != 0 ] && echo "ERROR: E2ENode Test suite exited with code:$rc"; exit $rc